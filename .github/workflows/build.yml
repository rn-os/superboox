name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

# Needed to create the test releases below.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "superboox-build-${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: superboox-build-${{ github.run_number }}
          path: superboox-build-*.apk
      # Each push becomes a GitHub release with the APK attached: a direct .apk link
      # for the BOOX browser, and an update source for Obtainium. The tag equals the
      # APK's versionName (0.1.0-build.N, see app/build.gradle.kts) so Obtainium's
      # version detection matches installed and released builds.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 0.1.0-build.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: SuperBoox 0.1.0-build.${{ github.run_number }}
          prerelease: false
          make_latest: true
          files: superboox-build-*.apk
          body: |
            Test build from `${{ github.ref_name }}` at ${{ github.sha }}.

            **Install:** download the `.apk` below on your BOOX, open it, and allow installs from the browser or file manager if asked. It installs over earlier test builds and keeps your settings.
            **Updates with Obtainium:** add `https://github.com/rn-os/superboox` as an app source.
            **First run:** SuperBoox → Accessibility settings → turn on "SuperBoox Quick Access", then allow SuperBoox to run in the background in BOOX App Management.
            **Found a bug?** SuperBoox → Troubleshooting → Copy debug report.
