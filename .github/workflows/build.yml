name: Build APK

on:
  push:
    branches: ["**"]
    # A version tag (v1.0.0) publishes a stable release; path filters don't apply to tags.
    tags: ["v*"]
    # Docs/mockup-only pushes don't produce a new APK or release.
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a stable release with this version (e.g. 1.0.0); leave empty for a pre-release"
        required: false
        default: ""

# Needed to create the releases below.
permissions:
  contents: write

env:
  # The version being worked towards: branch builds are pre-releases of it.
  NEXT_VERSION: "1.1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Stable: a manual run with release=1.2.3, or a v1.2.3 tag -> version 1.2.3 (tag v1.2.3 created). Everything else: NEXT_VERSION-dev.<run>, a pre-release.
      - name: Version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.release }}" ]]; then
            echo "name=${{ github.event.inputs.release }}" >> "$GITHUB_OUTPUT"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "name=${NEXT_VERSION}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build debug APK
        run: SB_VERSION="${{ steps.version.outputs.name }}" ./gradlew --no-daemon assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "superboox-${{ steps.version.outputs.name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: superboox-${{ steps.version.outputs.name }}
          path: superboox-*.apk
      # Stable releases: a direct .apk link for the BOOX browser and the update Obtainium offers
      # by default. The tag equals the APK's versionName so Obtainium's version check matches.
      - name: Publish stable release
        if: steps.version.outputs.stable == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: SuperBoox ${{ steps.version.outputs.name }}
          prerelease: false
          make_latest: true
          files: superboox-*.apk
          body_path: docs/releases/v${{ steps.version.outputs.name }}.md
      # Every other push: a pre-release. Obtainium only offers these with "Include prereleases" on.
      - name: Publish pre-release
        if: steps.version.outputs.stable == 'false' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: SuperBoox ${{ steps.version.outputs.name }} (pre-release)
          prerelease: true
          make_latest: false
          files: superboox-*.apk
          body: |
            **Pre-release** from `${{ github.ref_name }}` at ${{ github.sha }}: new work being tested, may have rough edges.
            For the stable version, use the release marked **Latest**.

            **Install:** download the `.apk` below on your BOOX and open it. It installs over earlier builds and keeps your settings.
            **Updates with Obtainium:** add `https://github.com/rn-os/superboox`; turn on "Include prereleases" in the app's Obtainium settings to get these.
            **Found a bug?** SuperBoox → Troubleshooting → Copy debug report.
