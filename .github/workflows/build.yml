name: Build APK

on:
  push:
    branches: ["**"]
    # A version tag (v1.0.0) publishes a stable release; path filters don't apply to tags.
    tags: ["v*"]
    # Docs/mockup-only pushes don't produce a new APK or release.
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a stable release with this version (e.g. 1.0.0); leave empty for a pre-release"
        required: false
        default: ""

# Needed to create the releases below.
permissions:
  contents: write

env:
  # The version being worked towards: default-branch builds are pre-releases of it.
  NEXT_VERSION: "1.1.0"

jobs:
  build:
    # A branch push already builds the commit; only PRs from forks need their own run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Stable: a manual run with release=1.2.3, or a v1.2.3 tag -> version 1.2.3 (tag v1.2.3 created).
      # Default branch (push or manual run): NEXT_VERSION-dev.<run>, published as a pre-release.
      # Any other branch or PR: NEXT_VERSION-branch.<run>, a workflow artifact only, so it never
      # shows up in Obtainium as the newest build.
      - name: Version
        id: version
        env:
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if [[ -n "${{ github.event.inputs.release }}" ]]; then
            echo "name=${{ github.event.inputs.release }}" >> "$GITHUB_OUTPUT"
            echo "kind=stable" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "kind=stable" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" != pull_request && "${GITHUB_REF}" == "${DEFAULT_REF}" ]]; then
            echo "name=${NEXT_VERSION}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "kind=dev" >> "$GITHUB_OUTPUT"
          else
            echo "name=${NEXT_VERSION}-branch.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "kind=branch" >> "$GITHUB_OUTPUT"
          fi
      # Panel logic that doesn't need a device (apps grid paging, Previous app bottom-right, ...).
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      # Does this change need a tablet pass? See TESTING.md. Printed on the run page; nothing is blocked.
      - name: Device pass needed?
        if: github.event_name == 'pull_request' || steps.version.outputs.kind == 'branch'
        run: |
          git fetch --no-tags --depth=200 origin "${{ github.event.repository.default_branch }}" || true
          { echo "### Device pass: $(tools/needs-device.sh origin/${{ github.event.repository.default_branch }} || echo unknown)"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
      # Adb test hooks (tools/tablet-test.sh) are compiled in only for unpublished branch/PR builds,
      # never for the default-branch pre-releases or stable releases that users install.
      - name: Build debug APK
        env:
          SB_TEST_HOOKS: ${{ steps.version.outputs.kind == 'branch' && '1' || '0' }}
        run: SB_VERSION="${{ steps.version.outputs.name }}" ./gradlew --no-daemon assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "superboox-${{ steps.version.outputs.name }}.apk"
      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: superboox-${{ steps.version.outputs.name }}
          path: superboox-*.apk
      # Branch and PR builds: where to get the APK for testing (signed with the same key, so it
      # installs over any other build). From a Mac: gh run download <run id> -R rn-os/superboox
      - name: Summary
        if: steps.version.outputs.kind == 'branch'
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          {
            echo "### Test build ${{ steps.version.outputs.name }} (not published)"
            echo "From \`${BRANCH}\` at ${{ github.sha }}."
            echo "Download: ${{ steps.artifact.outputs.artifact-url }} (a .zip holding the .apk)"
            echo "Or: \`gh run download ${{ github.run_id }} -R ${{ github.repository }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      # Stable releases: a direct .apk link for the BOOX browser and the update Obtainium offers
      # by default. The tag equals the APK's versionName so Obtainium's version check matches.
      - name: Publish stable release
        if: steps.version.outputs.kind == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: SuperBoox ${{ steps.version.outputs.name }}
          prerelease: false
          make_latest: true
          files: superboox-*.apk
          body_path: docs/releases/v${{ steps.version.outputs.name }}.md
      # Default-branch builds: a pre-release. Obtainium only offers these with "Include prereleases" on.
      - name: Publish pre-release
        if: steps.version.outputs.kind == 'dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: SuperBoox ${{ steps.version.outputs.name }} (pre-release)
          prerelease: true
          make_latest: false
          files: superboox-*.apk
          body: |
            **Pre-release** from `${{ github.ref_name }}` at ${{ github.sha }}: new work being tested, may have rough edges.
            For the stable version, use the release marked **Latest**.

            **Install:** download the `.apk` below on your BOOX and open it. It installs over earlier builds and keeps your settings.
            **Updates with Obtainium:** add `https://github.com/rn-os/superboox`; turn on "Include prereleases" in the app's Obtainium settings to get these.
            **Found a bug?** SuperBoox → Troubleshooting → Copy debug report.
