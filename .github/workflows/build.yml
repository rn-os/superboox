name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "superboox-build-${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: superboox-build-${{ github.run_number }}
          path: superboox-build-*.apk
