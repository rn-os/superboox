<!doctype html>
<html><head><meta charset="utf-8">
<!-- Launch images: the panel as built (build 23), with made-up note names and a public-domain book. -->
<style>
  @font-face { font-family: Roboto; src: url(../mockups/fonts/roboto-latin-400-normal.woff2); }
  @font-face { font-family: Roboto; font-weight: 500; src: url(../mockups/fonts/roboto-latin-500-normal.woff2); }
  @font-face { font-family: Roboto; font-weight: 700; src: url(../mockups/fonts/roboto-latin-700-normal.woff2); }
  body { margin: 0; background: #e8e8e8; font-family: Roboto, sans-serif; color: #000; }
  .stage { padding: 36px; width: max-content; }
  .device { width: 1240px; height: 930px; background: #2b2b2b; border-radius: 34px; padding: 30px; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .screen { width: 100%; height: 100%; background: #fafaf7; position: relative; overflow: hidden; border-radius: 4px; }
  .sb { height: 26px; display: flex; justify-content: space-between; align-items: center; padding: 0 14px; font-size: 13px; font-weight: 500; }
  .reader { padding: 10px 90px 0 70px; font-family: Georgia, "DejaVu Serif", serif; font-size: 21px; line-height: 1.55; text-align: justify; }
  .reader h1 { font-size: 34px; text-align: center; margin: 18px 0 2px; font-weight: 400; }
  .reader h2 { font-size: 18px; text-align: center; margin: 0 0 18px; font-weight: 400; letter-spacing: .2em; }
  .reader p { margin: 0 0 10px; text-indent: 1.5em; }
  .foot { position: absolute; bottom: 10px; left: 70px; right: 70px; display: flex; justify-content: space-between; font-size: 13px; color: #444; }
  .sheet { position: absolute; top: 0; right: 0; bottom: 0; background: #fff; display: flex; flex-direction: column; border-left: 3px solid #000; }
  svg { display: block; flex: none; }
  .top { display: flex; border-bottom: 1.5px solid #000; }
  .top .c { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 12px 0 9px; font-size: 15px; font-weight: 500; gap: 4px; }
  .top .sep { width: 1.5px; background: #000; }
  .top .gear { width: 50px; display: flex; align-items: center; justify-content: center; }
  .last { display: flex; align-items: center; padding: 11px 16px; gap: 14px; }
  .last b { display: block; font-size: 17px; font-weight: 500; }
  .last span { display: block; font-size: 13px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ir { height: 1px; background: #000; margin: 0 16px; flex: none; }
  .qa { position: relative; text-align: center; font-size: 17px; font-weight: 700; padding: 13px 16px; border-top: 2.5px solid #000; border-bottom: 1px solid #000; }
  .qa .add { position: absolute; right: 10px; top: 7px; display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: 400; }
  .qa .back { position: absolute; left: 8px; top: 12px; display: flex; align-items: center; font-size: 14px; font-weight: 400; }
  .pin { display: flex; align-items: center; gap: 12px; padding: 12px 18px; font-size: 17px; white-space: nowrap; }
  .rec { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
  .rec b { display: block; font-size: 17px; font-weight: 400; } .rec span { font-size: 13px; color: #333; }
  .body { flex: 1; overflow: hidden; }
  .apps { border-top: 2.5px solid #000; }
  .apps .row { display: flex; } .apps .row + .row { border-top: 1px solid #000; }
  .apps .cell { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 0; font-size: 14px; gap: 3px; }
  .apps .vs { width: 1px; background: #000; margin: 10px 0; }
  .pager { display: flex; justify-content: center; align-items: center; gap: 14px; border-top: 1px solid #000; padding: 4px 0; font-size: 14px; font-weight: 700; }
  /* settings */
  .set { position: absolute; inset: 26px 0 0 0; overflow: hidden; background: #fff; }
  .set .cols { display: flex; gap: 0; }
  .set .colx { flex: 1; min-width: 0; }
  .title { font-size: 28px; font-weight: 700; padding: 16px 16px 10px; }
  .rule3 { height: 3px; background: #000; }
  .para { font-size: 14px; color: #333; padding: 8px 20px 4px; line-height: 1.4; }
  .sec { padding: 16px 20px 8px; font-size: 14px; font-weight: 700; letter-spacing: .06em; }
  .card { margin: 0 12px; border: 2px solid #000; border-radius: 8px; overflow: hidden; }
  .card > * + * { border-top: 1px solid #000; }
  .choice { display: flex; align-items: center; padding: 12px 16px; font-size: 17px; font-weight: 500; }
  .choice b { margin-left: auto; font-size: 15px; }
  .check { display: flex; align-items: center; gap: 14px; padding: 10px 16px 10px 18px; font-size: 17px; }
  .box { width: 18px; height: 18px; border: 2px solid #000; border-radius: 2px; position: relative; flex: none; }
  .box.on { background: #000; }
  .box.on::after { content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .slider { padding: 8px 16px; font-size: 15px; }
  .track { position: relative; height: 24px; margin: 0 6px; }
  .track i { position: absolute; left: 0; right: 0; top: 11px; height: 2px; background: #888; }
  .track u { position: absolute; left: 0; top: 11px; height: 2px; background: #000; }
  .track s { position: absolute; top: 5px; width: 14px; height: 14px; border-radius: 50%; background: #000; margin-left: -7px; }
  .item { display: flex; align-items: center; padding: 7px 10px 7px 16px; gap: 6px; }
  .item .t { flex: 1; min-width: 0; } .item .t1 { font-size: 17px; font-weight: 500; } .item .t2 { font-size: 13px; color: #333; }
  .ib { width: 38px; height: 38px; border: 2px solid #000; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex: none; }
  .ib.off { border-color: #888; } .ib.off svg path { fill: #888; }
  .btns { display: flex; gap: 8px; padding: 10px 12px; }
  .btn { flex: 1; min-height: 42px; border: 2px solid #000; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; }
  .callout { position: absolute; background: #fff; border: 2px solid #000; border-radius: 16px; font: 700 15px Roboto; padding: 5px 12px; }
</style></head>
<body><div class="stage"><div class="device"><div class="screen" id="scr"></div></div></div>
<script>
const F = {
  clock: "M11.99,2C6.47,2 2,6.48 2,12s4.47,10 9.99,10C17.52,22 22,17.52 22,12S17.52,2 11.99,2zM12,20c-4.42,0 -8,-3.58 -8,-8s3.58,-8 8,-8 8,3.58 8,8 -3.58,8 -8,8zM12.5,7H11v6l5.25,3.15 0.75,-1.23 -4.5,-2.67z",
  book: "M21,5c-1.11,-0.35 -2.33,-0.5 -3.5,-0.5 -1.95,0 -4.05,0.4 -5.5,1.5 -1.45,-1.1 -3.55,-1.5 -5.5,-1.5S2.45,4.9 1,6v14.65c0,0.25 0.25,0.5 0.5,0.5 0.1,0 0.15,-0.05 0.25,-0.05C3.1,20.45 5.05,20 6.5,20c1.95,0 4.05,0.4 5.5,1.5 1.35,-0.85 3.8,-1.5 5.5,-1.5 1.65,0 3.35,0.3 4.75,1.05 0.1,0.05 0.15,0.05 0.25,0.05 0.25,0 0.5,-0.25 0.5,-0.5V6c-0.6,-0.45 -1.25,-0.75 -2,-1zM21,18.5c-1.1,-0.35 -2.3,-0.5 -3.5,-0.5 -1.7,0 -4.15,0.65 -5.5,1.5V8c1.35,-0.85 3.8,-1.5 5.5,-1.5 1.2,0 2.4,0.15 3.5,0.5v11.5z",
  link_add: "M8,11h8v2H8zM20.1,12H22c0,-2.76 -2.24,-5 -5,-5h-4v1.9h4c1.71,0 3.1,1.39 3.1,3.1zM3.9,12c0,-1.71 1.39,-3.1 3.1,-3.1h4V7H7c-2.76,0 -5,2.24 -5,5s2.24,5 5,5h4v-1.9H7c-1.71,0 -3.1,-1.39 -3.1,-3.1zM19,12h-2v3h-3v2h3v3h2v-3h3v-2h-3z",
  settings: "M3,17v2h6v-2H3zM3,5v2h10V5H3zM13,21v-2h8v-2h-8v-2h-2v6h2zM7,9v2H3v2h4v2h2V9H7zM21,13v-2H11v2h10zM15,9h2V7h4V5h-4V3h-2v6z",
  folder: "M10,4H4c-1.1,0 -2,0.9 -2,2v12c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V8c0,-1.1 -0.9,-2 -2,-2h-8l-2,-2z",
  file: "M14,2H6c-1.1,0 -2,0.9 -2,2v16c0,1.1 0.9,2 2,2h12c1.1,0 2,-0.9 2,-2V8l-6,-6zM16,18H8v-2h8v2zM16,14H8v-2h8v2zM13,9V3.5L18.5,9H13z",
  left: "M15.41,7.41L14,6l-6,6 6,6 1.41,-1.41L10.83,12z", right: "M10,6L8.59,7.41 13.17,12l-4.58,4.59L10,18l6,-6z",
  up: "M7.41,15.41L12,10.83l4.59,4.58L18,14l-6,-6 -6,6z", down: "M7.41,8.59L12,13.17l4.59,-4.58L18,10l-6,6 -6,-6z",
  edit: "M3,17.25V21h3.75L17.81,9.94l-3.75,-3.75L3,17.25zM20.71,7.04a1,1 0,0 0,0 -1.41l-2.34,-2.34a1,1 0,0 0,-1.41 0l-1.83,1.83 3.75,3.75 1.83,-1.83z",
  del: "M6,19c0,1.1 0.9,2 2,2h8c1.1,0 2,-0.9 2,-2V7H6v12zM19,4h-3.5l-1,-1h-5l-1,1H5v2h14V4z",
};
const S = {
  note: "M7,3h10a2,2 0 0 1 2,2v14a2,2 0 0 1 -2,2H7z M4,7.5h5 M4,12h5 M4,16.5h5 M12,8.5h4 M12,12h4 M12,15.5h3",
  note_new: "M7,3h10a2,2 0 0 1 2,2v14a2,2 0 0 1 -2,2H7z M4,7.5h5 M4,12h5 M4,16.5h5 M14,8.5v7 M10.5,12h7",
  apps: "M4,4h6v6H4z M14,4h6v6h-6z M4,14h6v6H4z M14,14h6v6h-6z",
};
const g = (k, s = 24, c = "#000") => S[k]
  ? `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" d="${S[k]}"/></svg>`
  : `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path fill="${c}" d="${F[k]}"/></svg>`;
// Stand-in app icons (grayscale, generic).
const APPS = {
  Calendar: `<rect x="11" y="13" width="26" height="24" rx="2" fill="#fff"/><rect x="11" y="13" width="26" height="6" fill="#999"/><text x="24" y="33" font-size="13" text-anchor="middle" font-family="Roboto" font-weight="700">10</text>`,
  Dictionary: `<rect x="13" y="11" width="22" height="26" rx="2" fill="#fff"/><text x="24" y="30" font-size="14" text-anchor="middle" font-family="DejaVu Serif" font-weight="700">Aa</text>`,
  Calculator: `<rect x="14" y="11" width="20" height="26" rx="2" fill="#fff"/><rect x="17" y="14" width="14" height="6" fill="#666"/><g fill="#666"><rect x="17" y="23" width="4" height="4"/><rect x="22" y="23" width="4" height="4"/><rect x="27" y="23" width="4" height="4"/><rect x="17" y="29" width="4" height="4"/><rect x="22" y="29" width="4" height="4"/><rect x="27" y="29" width="4" height="4"/></g>`,
  Browser: `<circle cx="24" cy="24" r="12" fill="none" stroke="#fff" stroke-width="2.5"/><ellipse cx="24" cy="24" rx="5" ry="12" fill="none" stroke="#fff" stroke-width="2"/><path d="M12 24h24" stroke="#fff" stroke-width="2"/>`,
};
const app = (n) => `<svg width="40" height="40" viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="#3a3a3a"/>${APPS[n]}</svg>`;

const WALDEN = [
  "When I wrote the following pages, or rather the bulk of them, I lived alone, in the woods, a mile from any neighbor, in a house which I had built myself, on the shore of Walden Pond, in Concord, Massachusetts, and earned my living by the labor of my hands only. I lived there two years and two months. At present I am a sojourner in civilized life again.",
  "I should not obtrude my affairs so much on the notice of my readers if very particular inquiries had not been made by my townsmen concerning my mode of life, which some would call impertinent, though they do not appear to me at all impertinent, but, considering the circumstances, very natural and pertinent. Some have asked what I got to eat; if I did not feel lonesome; if I was not afraid; and the like.",
  "Others have been curious to learn what portion of my income I devoted to charitable purposes; and some, who have large families, how many poor children I maintained. I will therefore ask those of my readers who feel no particular interest in me to pardon me if I undertake to answer some of these questions in this book.",
  "In most books, the I, or first person, is omitted; in this it will be retained; that, in respect to egotism, is the main difference. We commonly do not remember that it is, after all, always the first person that is speaking. I should not talk so much about myself if there were anybody else whom I knew as well.",
];
const sb = `<div class="sb"><span>9:41</span><span>Wi‑Fi&nbsp;&nbsp;82%</span></div>`;
const reader = () => sb + `<div class="reader"><h1>Walden</h1><h2>ECONOMY</h2>${WALDEN.map(p => `<p>${p}</p>`).join("")}</div><div class="foot"><span>Walden — Henry David Thoreau</span><span>12 / 284</span></div>`;

const PINS = [["note", "Meeting Notes"], ["note", "Daily Journal"], ["note", "Project Ideas"], ["book", "Meditations"], ["folder", "Exports"], ["apps", "Dictionary"]];
function sheet(middle) {
  return `<div class="sheet" style="width:45%">
    <div class="top"><div class="c">${g("clock", 32)}Recent Files</div><div class="sep"></div><div class="c">${g("note_new", 32)}New Note</div><div class="sep"></div><div class="gear">${g("settings", 26)}</div></div>
    <div class="last">${g("note", 30)}<div style="min-width:0"><b>Last Opened Note</b><span>Daily Journal</span></div></div><div class="ir"></div>
    <div class="last">${g("book", 30)}<div style="min-width:0"><b>Last Opened Document</b><span>Meditations · NeoReader</span></div></div>
    <div class="body">${middle}</div>
    <div class="apps"><div class="row"><div class="cell">${app("Calendar")}Calendar</div><div class="vs"></div><div class="cell">${app("Dictionary")}Dictionary</div></div>
      <div class="row"><div class="cell">${app("Calculator")}Calculator</div><div class="vs"></div><div class="cell">${app("Browser")}Browser</div></div>
      <div class="pager">${g("left", 24, "#888")}1 / 2${g("right", 24)}</div></div></div>`;
}
const quick = () => `<div class="qa">Quick Access<div class="add">${g("link_add", 24)}Add</div></div>` +
  PINS.map(([k, t], i) => (i ? `<div class="ir"></div>` : "") + `<div class="pin">${g(k, 22)}${t}</div>`).join("");
const recent = () => `<div class="qa"><div class="back">${g("left", 24)}Back</div>Recent Files</div>` +
  [["note", "Daily Journal", "Note · 5 min ago"], ["book", "Meditations", "NeoReader · 1 hour ago"], ["note", "Meeting Notes", "Note · 3 hours ago"],
   ["note", "Project Ideas", "Note · Yesterday"], ["book", "Walden", "NeoReader · Yesterday"], ["file", "Q3 Plan.pdf", "Document · Oct 7"]]
  .map(([k, t, s], i) => (i ? `<div class="ir"></div>` : "") + `<div class="rec">${g(k, 24)}<div><b>${t}</b><span>${s}</span></div></div>`).join("");

const choice = (k, v) => `<div class="choice">${k}<b>${v}&nbsp; ›</b></div>`;
const check = (l, on) => `<div class="check"><div class="box ${on ? "on" : ""}"></div>${l}</div>`;
const slider = (l, v, a, b, u) => `<div class="slider">${l}: ${v} ${u}<div class="track"><i></i><u style="width:${(v-a)/(b-a)*100}%"></u><s style="left:${(v-a)/(b-a)*100}%"></s></div></div>`;
const ib = (k, off) => `<div class="ib ${off ? "off" : ""}">${g(k, 22)}</div>`;
const item = (t1, t2, i, n) => `<div class="item"><div class="t"><div class="t1">${t1}</div><div class="t2">${t2}</div></div>${ib("up", i === 0)}${ib("down", i === n - 1)}${ib("edit")}${ib("del")}</div>`;
const settings = () => `<div class="set"><div class="title">SuperBoox</div><div class="rule3"></div><div>
  <div><div class="para">A Supernote-style Quick Access panel for BOOX. Swipe from the screen edge on any page to open it.</div>
    <div class="sec">GESTURE</div><div class="card">${choice("Screen edge", "Right")}${choice("Trigger", "Swipe up or down along the edge")}${check("Edge gesture enabled", true)}
    ${slider("Touch strip height", 35, 10, 100, "% of screen")}${slider("Panel width", 45, 25, 100, "% of screen")}${choice("Menu size", "Large")}${check("Use apps' own icons for pinned apps", false)}</div></div>
  <div><div class="sec">QUICK ACCESS ITEMS</div><div class="card">
    ${[["Meeting Notes", "BOOX note"], ["Daily Journal", "BOOX note"], ["Project Ideas", "BOOX note"], ["Meditations", "Document · Meditations.epub"]].map(([a, b], i) => item(a, b, i, 4)).join("")}
    <div class="btns"><div class="btn">+ BOOX note</div><div class="btn">+ Document</div><div class="btn">+ App</div></div></div>
    <div class="para">Easiest way to add a note or book: open it, swipe the panel open and tap Add.</div></div></div></div>`;

const SCREENS = {
  panel: () => reader() + sheet(quick()),
  recent: () => reader() + sheet(recent()),
  settings: () => sb + settings(),
};
document.getElementById("scr").innerHTML = SCREENS[location.hash.slice(1) || "panel"]();
</script></body></html>
