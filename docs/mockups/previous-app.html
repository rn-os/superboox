<!doctype html>
<html><head><meta charset="utf-8">
<!-- "Previous app" in the bottom apps grid (opt-in). -->
<style>
  @font-face { font-family: Roboto; src: url(fonts/roboto-latin-400-normal.woff2); }
  @font-face { font-family: Roboto; font-weight: 500; src: url(fonts/roboto-latin-500-normal.woff2); }
  @font-face { font-family: Roboto; font-weight: 700; src: url(fonts/roboto-latin-700-normal.woff2); }
  body { margin: 0; background: #e8e8e8; font-family: Roboto, sans-serif; color: #000; }
  .stage { display: flex; gap: 28px; padding: 28px; width: max-content; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .cap { font-size: 20px; font-weight: 700; max-width: 480px; }
  .cap small { display: block; font-size: 15px; font-weight: 400; color: #333; margin-top: 4px; line-height: 1.4; }
  .panel { width: 480px; background: #fff; border-left: 3px solid #000; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
  .qa { text-align: center; font-size: 17px; font-weight: 700; padding: 13px; border-bottom: 1px solid #000; }
  .pin { padding: 12px 18px; font-size: 17px; border-bottom: 1px solid #000; margin: 0 16px; padding-left: 2px; }
  .gap { height: 60px; }
  .apps { border-top: 2.5px solid #000; }
  .row { display: flex; } .row + .row { border-top: 1px solid #000; }
  .cell { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 0 8px; font-size: 14px; gap: 4px; }
  .vs { width: 1px; background: #000; margin: 10px 0; }
  .appi { width: 44px; height: 44px; border-radius: 11px; background: #3a3a3a; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; position: relative; }
  .badge { position: absolute; left: -8px; top: -8px; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 2px solid #000; display: flex; align-items: center; justify-content: center; }
  .pager { display: flex; justify-content: center; align-items: center; gap: 14px; border-top: 1px solid #000; padding: 4px 0; font-size: 14px; font-weight: 700; }
  .set { width: 560px; background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.15); padding-bottom: 16px; }
  .sec { padding: 18px 20px 8px; font-size: 14px; font-weight: 700; letter-spacing: .06em; }
  .card { margin: 0 12px; border: 2px solid #000; border-radius: 8px; overflow: hidden; }
  .card > * + * { border-top: 1px solid #000; }
  .check { display: flex; align-items: center; gap: 14px; padding: 12px 16px 12px 18px; font-size: 17px; }
  .check small { display: block; font-size: 13px; color: #333; }
  .box { width: 18px; height: 18px; border: 2px solid #000; border-radius: 2px; position: relative; flex: none; }
  .box.on { background: #000; }
  .box.on::after { content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .item { display: flex; align-items: center; padding: 8px 10px 8px 16px; gap: 6px; }
  .item .t { flex: 1; } .item .t1 { font-size: 17px; font-weight: 500; } .item .t2 { font-size: 13px; color: #333; }
  .ib { width: 38px; height: 38px; border: 2px solid #000; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .ib.off { border-color: #888; } .ib.off path { fill: #888; }
  .btns { display: flex; gap: 8px; padding: 10px 12px; }
  .btn { flex: 1; min-height: 42px; border: 2px solid #000; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; }
</style></head>
<body><div class="stage" id="stage"></div>
<script>
const P = { back: "M20,11H7.83l5.59,-5.59L12,4l-8,8 8,8 1.41,-1.41L7.83,13H20v-2z",
  left: "M15.41,7.41L14,6l-6,6 6,6 1.41,-1.41L10.83,12z", right: "M10,6L8.59,7.41 13.17,12l-4.58,4.59L10,18l6,-6z",
  up: "M7.41,15.41L12,10.83l4.59,4.58L18,14l-6,-6 -6,6z", down: "M7.41,8.59L12,13.17l4.59,-4.58L18,10l-6,6 -6,-6z",
  del: "M6,19c0,1.1 0.9,2 2,2h8c1.1,0 2,-0.9 2,-2V7H6v12zM19,4h-3.5l-1,-1h-5l-1,1H5v2h14V4z" };
const ic = (k, s = 22, c = "#000") => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path fill="${c}" d="${P[k]}"/></svg>`;
const ib = (k, off) => `<div class="ib ${off ? "off" : ""}">${ic(k)}</div>`;
document.getElementById("stage").innerHTML = `
<div class="col"><div class="cap">Panel<small><b>Previous app</b> is the first app at the bottom. It shows the icon of the app you were in before this one, with a small ← badge, and tapping it switches straight back.</small></div>
  <div class="panel"><div class="qa">Quick Access</div><div class="pin">Meeting Notes</div><div class="pin">Daily Journal</div><div class="pin" style="border:0">Project Ideas</div><div class="gap"></div>
  <div class="apps"><div class="row"><div class="cell"><div class="appi">Rd<div class="badge">${ic("back", 15)}</div></div>Previous app</div><div class="vs"></div><div class="cell"><div class="appi">10</div>Calendar</div></div>
    <div class="row"><div class="cell"><div class="appi">Aa</div>Dictionary</div><div class="vs"></div><div class="cell"><div class="appi">±</div>Calculator</div></div>
    <div class="pager">${ic("left", 24, "#888")}1 / 2${ic("right", 24)}</div></div></div></div>
<div class="col"><div class="cap">Settings<small>Off by default. Turn it on in the <b>Apps at the bottom</b> card.</small></div>
  <div class="set"><div class="sec">APPS AT THE BOTTOM</div><div class="card">
    <div class="check"><div class="box on"></div><div>Show "Previous app"<small>The app you were in before this one, first in the grid</small></div></div>
    <div class="item"><div class="t"><div class="t1">Calendar</div><div class="t2">App</div></div>${ib("up", true)}${ib("down")}${ib("del")}</div>
    <div class="item"><div class="t"><div class="t1">Dictionary</div><div class="t2">App</div></div>${ib("up")}${ib("down")}${ib("del")}</div>
    <div class="item"><div class="t"><div class="t1">Calculator</div><div class="t2">App</div></div>${ib("up")}${ib("down", true)}${ib("del")}</div>
    <div class="btns"><div class="btn">+ Add app</div></div></div></div></div>`;
</script></body></html>
