<!doctype html>
<html><head><meta charset="utf-8">
<!-- Quick Controls proposal: the Back/Home row grows into a customizable, paged set of toggles. -->
<style>

  @font-face { font-family: Roboto; font-weight: 500; src: url(fonts/roboto-latin-500-normal.woff2); }
  @font-face { font-family: Roboto; font-weight: 700; src: url(fonts/roboto-latin-700-normal.woff2); }
  body { margin: 0; background: #e8e8e8; font-family: Roboto, sans-serif; color: #000; }

  .notes h3 { font-size: 20px; margin: 0 0 10px; }
  .notes li { margin-bottom: 8px; }

  .top { display: flex; border-bottom: 1.5px solid #000; }
  .top .c { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 12px 0 9px; font-size: 15px; font-weight: 500; gap: 4px; }
  .top .sep { width: 1.5px; background: #000; }
  .top .gear { width: 50px; display: flex; align-items: center; justify-content: center; }
  .qc { border-bottom: 2.5px solid #000; padding: 12px 6px 4px; }
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); row-gap: 10px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12px; text-align: center; line-height: 1.15; }
  .dot { width: 54px; height: 54px; border-radius: 50%; border: 2px solid #000; display: flex; align-items: center; justify-content: center; box-sizing: border-box; background: #fff; }
  .dot.on { background: #000; }
  .pager { display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; padding: 6px 0 4px; }
  .last { display: flex; align-items: center; padding: 11px 16px; gap: 14px; }
  .last b { display: block; font-size: 17px; font-weight: 500; } .last span { display: block; font-size: 13px; color: #333; }
  .ir { height: 1px; background: #000; margin: 0 16px; flex: none; }
  .qa { position: relative; text-align: center; font-size: 17px; font-weight: 700; padding: 13px 16px; border-top: 2.5px solid #000; border-bottom: 1px solid #000; }
  .qa .add { position: absolute; right: 10px; top: 7px; display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: 400; }
  .pin { display: flex; align-items: center; gap: 12px; padding: 12px 18px; font-size: 17px; }
  .apps { margin-top: auto; border-top: 2.5px solid #000; }
  .apps .row { display: flex; } .apps .row + .row { border-top: 1px solid #000; }
  .apps .cell { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 0; font-size: 14px; gap: 3px; }
  .apps .vs { width: 1px; background: #000; margin: 10px 0; }
  .appi { width: 40px; height: 40px; border-radius: 10px; background: #3a3a3a; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
  .bubble { position: absolute; background: #fff; border: 2px solid #000; border-radius: 12px; padding: 6px 10px; font-size: 13px; font-weight: 500; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  /* settings */
  .set { width: 620px; height: 1000px; background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.15); overflow: hidden; position: relative; }
  .title { font-size: 28px; font-weight: 700; padding: 18px 16px 10px; } .rule3 { height: 3px; background: #000; }
  .sec { padding: 18px 20px 8px; font-size: 14px; font-weight: 700; letter-spacing: .06em; }
  .card { margin: 0 12px; border: 2px solid #000; border-radius: 8px; overflow: hidden; }
  .card > * + * { border-top: 1px solid #000; }
  .choice { display: flex; align-items: center; padding: 12px 16px; font-size: 17px; font-weight: 500; } .choice b { margin-left: auto; font-size: 15px; }
  .check { display: flex; align-items: center; gap: 14px; padding: 10px 16px 10px 18px; font-size: 17px; }
  .box { width: 18px; height: 18px; border: 2px solid #000; border-radius: 2px; position: relative; flex: none; }
  .box.on { background: #000; }
  .box.on::after { content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .item { display: flex; align-items: center; padding: 7px 10px 7px 14px; gap: 6px; }
  .item .t { flex: 1; min-width: 0; padding-left: 6px; } .item .t1 { font-size: 17px; font-weight: 500; } .item .t2 { font-size: 13px; color: #333; }
  .ib { width: 38px; height: 38px; border: 2px solid #000; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex: none; }
  .ib.off { border-color: #888; } .ib.off path { fill: #888; }
  .btns { display: flex; gap: 8px; padding: 10px 12px; }
  .btn { flex: 1; min-height: 42px; border: 2px solid #000; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; }
  .para { font-size: 14px; color: #333; padding: 8px 20px 4px; line-height: 1.4; }
  .dim { position: absolute; inset: 0; background: rgba(0,0,0,.35); }
  .dialog { position: absolute; left: 36px; right: 36px; top: 40px; bottom: 24px; background: #fff; border: 2px solid #000; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
  .dialog h4 { margin: 0; padding: 16px 18px 10px; font-size: 20px; }
  .grp { padding: 12px 18px 4px; font-size: 13px; font-weight: 700; letter-spacing: .06em; }
  .opt { display: flex; align-items: center; gap: 12px; padding: 6px 18px; }
  .opt .added { margin-left: auto; font-size: 12.5px; font-weight: 700; color: #555; }
  .opt .t1 { font-size: 16px; font-weight: 500; } .opt .t2 { font-size: 12.5px; color: #333; }
</style></head>
