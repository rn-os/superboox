<!doctype html>
<html><head><meta charset="utf-8">
<!-- Settings: current layout vs. proposed bordered cards. Mirrors SettingsActivity.kt (build 21). -->
<style>
  @font-face { font-family: Roboto; src: url(fonts/roboto-latin-400-normal.woff2); }
  @font-face { font-family: Roboto; font-weight: 500; src: url(fonts/roboto-latin-500-normal.woff2); }
  @font-face { font-family: Roboto; font-weight: 700; src: url(fonts/roboto-latin-700-normal.woff2); }
  body { margin: 0; background: #ddd; font-family: Roboto, sans-serif; color: #000; }
  .stage { display: flex; gap: 28px; padding: 24px; width: max-content; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .cap { font-size: 22px; font-weight: 700; }
  .cap small { display: block; font-size: 15px; font-weight: 400; color: #333; margin-top: 4px; max-width: 560px; line-height: 1.35; }
  .screen { width: 560px; height: 1060px; background: #fff; overflow: hidden; position: relative; border: 1px solid #999; }
  .sb { height: 24px; display: flex; justify-content: space-between; align-items: center; padding: 0 12px; font-size: 13px; font-weight: 500; }
  .title { font-size: 28px; font-weight: 700; padding: 20px 16px 10px; }
  .rule3 { height: 3px; background: #000; }
  .para { font-size: 14px; color: #333; padding: 4px 16px 8px; line-height: 1.4; }
  .status { font-size: 17px; font-weight: 700; padding: 12px 16px 4px; }
  .btns { display: flex; gap: 8px; padding: 6px 16px; }
  .btn { flex: 1; min-height: 44px; border: 2px solid #000; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; text-align: center; padding: 0 8px; }
  /* current section title */
  .sec { padding: 18px 16px 6px; font-size: 14px; font-weight: 700; letter-spacing: .06em; }
  .sec::after { content: ""; display: block; height: 2px; background: #000; margin-top: 4px; }
  .choice { display: flex; align-items: center; padding: 12px 16px; font-size: 17px; font-weight: 500; }
  .choice b { margin-left: auto; font-size: 15px; }
  .check { display: flex; align-items: center; gap: 14px; padding: 8px 16px; font-size: 17px; }
  .box { width: 18px; height: 18px; border: 2px solid #000; border-radius: 2px; position: relative; flex: none; }
  .box.on { background: #000; }
  .box.on::after { content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .slider { padding: 8px 16px; font-size: 15px; }
  .track { position: relative; height: 26px; margin: 0 6px; }
  .track i { position: absolute; left: 0; right: 0; top: 12px; height: 2px; background: #888; }
  .track u { position: absolute; left: 0; top: 12px; height: 2px; background: #000; }
  .track s { position: absolute; top: 6px; width: 14px; height: 14px; border-radius: 50%; background: #000; margin-left: -7px; }
  .item { display: flex; align-items: center; padding: 8px 10px 8px 16px; gap: 6px; }
  .item .t { flex: 1; min-width: 0; }
  .item .t1 { font-size: 17px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .t2 { font-size: 13px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ib { width: 40px; height: 40px; border: 2px solid #000; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex: none; }
  .ib.off { border-color: #888; } .ib.off svg { fill: #888; }
  .ib svg { width: 22px; height: 22px; }
  /* proposed */
  .new .sec { padding: 20px 20px 8px; }
  .new .sec::after { display: none; }
  .card { margin: 0 12px; border: 2px solid #000; border-radius: 8px; overflow: hidden; }
  .card > * + * { border-top: 1px solid #000; }
  .card .btns { padding: 10px 12px; }
  .new .para.after { padding: 8px 20px 4px; }
  .card .status { padding: 14px 16px 10px; }
</style></head>
<body><div class="stage" id="stage"></div>
<script>
const P = {
  up: "M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z", down: "M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z",
  edit: "M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z",
  del: "M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z",
};
const ib = (k, off) => `<div class="ib ${off ? "off" : ""}"><svg viewBox="0 0 24 24"><path d="${P[k]}"/></svg></div>`;
const choice = (k, v) => `<div class="choice">${k}<b>${v}&nbsp; ›</b></div>`;
const check = (l, on) => `<div class="check"><div class="box ${on ? "on" : ""}"></div>${l}</div>`;
const slider = (l, v, a, b, u) => `<div class="slider">${l}: ${v} ${u}<div class="track"><i></i><u style="width:${(v-a)/(b-a)*100}%"></u><s style="left:${(v-a)/(b-a)*100}%"></s></div></div>`;
const btns = (...l) => `<div class="btns">${l.map(b => `<div class="btn">${b}</div>`).join("")}</div>`;
const item = (t1, t2, i, n, edit = true) => `<div class="item"><div class="t"><div class="t1">${t1}</div><div class="t2">${t2}</div></div>${ib("up", i === 0)}${ib("down", i === n - 1)}${edit ? ib("edit") : ""}${ib("del")}</div>`;
const PINS = [["Alex Alsup Notes", "BOOX note · Alex Alsup Notes"], ["SuperBoox Notes", "BOOX note · SuperBoox Notes"],
  ["Boox Note Air Thoughts", "BOOX note · Boox Note Air Thoughts"], ["Outlive - The Science and Art of Longevity", "Document · Outlive - The Science and Art of Longevity -- MD Peter Attia….epub"]];
const sb = `<div class="sb"><span>5:40</span><span>100%</span></div>`;
const head = `${sb}<div class="title">SuperBoox</div><div class="rule3"></div><div style="height:8px"></div>`;
const intro = `<div class="para">A Supernote-style Quick Access panel for BOOX. Swipe from the screen edge on any page to open it.</div>`;
const gesture = [choice("Screen edge", "Right"), choice("Trigger", "Swipe up or down along the edge"), check("Edge gesture enabled", true),
  check("Show a small marker on the edge", false), slider("Touch strip width", 16, 6, 48, "dp"), slider("Touch strip height", 35, 10, 100, "% of screen"),
  slider("Touch strip position from top", 30, 0, 90, "%"), slider("Panel width", 45, 25, 100, "% of screen"),
  check("Show Back / Home / Recents / Capture row", true), choice("Menu size", "Large")];
const pins = PINS.map(([a, b], i) => item(a, b, i, PINS.length));
const tip = `Tip: the "Quick Access" app icon opens the panel too. Assign it to a BOOX gesture or the Navigation Ball if you'd rather not reserve a strip of the screen edge. There's also a Quick Settings tile.`;
const pinsTipOld = `BOOX notes open by name: SuperBoox starts BOOX Notes at its library and taps the note for you. Use "Folder / Note" for notes in folders. The easiest way to add one is to open BOOX Notes, swipe the panel open and tap "Pin a note from this screen".`;
const pinsTipNew = `Easiest way to add a note or book: open it, swipe the panel open and tap Add.`;
const dock = [item("Calendar", "App · com.onyx.mail", 0, 2, false), item("Settings", "App · com.android.settings", 1, 2, false)];

const now = (part) => part === 1 ? head + intro + `<div class="status">● Service is running</div>` + btns("Accessibility settings", "Open panel")
    + `<div class="sec">GESTURE</div>` + gesture.join("") + `<div class="para">${tip}</div>`
  : `<div style="height:24px"></div><div class="sec">QUICK ACCESS ITEMS</div>` + pins.join("") + btns("+ BOOX note", "+ Document", "+ Folder") + btns("+ App", "+ Custom intent")
    + `<div class="para">${pinsTipOld}</div><div class="sec">APPS AT THE BOTTOM</div>` + dock.join("") + btns("+ Add app")
    + `<div class="sec">RECENT FILES</div><div class="para">Show the newest files from a folder, e.g. where BOOX Notes exports PDFs (often /note or /Documents).</div>` + btns("Choose folder");
const card = (rows) => `<div class="card">${rows.join("")}</div>`;
const sec = (t) => `<div class="sec">${t}</div>`;
const fresh = (part) => part === 1 ? head + intro + card([`<div class="status">● Service is running</div>` + btns("Accessibility settings", "Open panel")])
    + sec("GESTURE") + card(gesture) + `<div class="para after">${tip}</div>`
  : `<div style="height:24px"></div>` + sec("QUICK ACCESS ITEMS") + card([...pins, btns("+ BOOX note", "+ Document", "+ Folder") + btns("+ App", "+ Custom intent")])
    + `<div class="para after">${pinsTipNew}</div>` + sec("APPS AT THE BOTTOM") + card([...dock, btns("+ Add app")])
    + sec("RECENT FILES") + card([`<div class="para" style="padding-top:12px">Show the newest files from a folder, e.g. where BOOX Notes exports PDFs (often /note or /Documents).</div>` + btns("Choose folder")]);

const part = Number(location.hash.slice(1) || 1);
document.getElementById("stage").innerHTML = `
  <div class="col"><div class="cap">Now<small>Rows run together; sections are only separated by a heading rule.</small></div><div class="screen">${now(part)}</div></div>
  <div class="col new"><div class="cap">Proposed<small>Each section is a black-bordered card; every row inside has a 1px rule between it and the next.</small></div><div class="screen">${fresh(part)}</div></div>`;
</script></body></html>
