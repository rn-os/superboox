<!doctype html>
<html><head><meta charset="utf-8">
<!-- Settings split into menus: a short home screen of sections, each opening its own page. Proposal after build 34. -->
<style>
  @font-face { font-family: Roboto; src: url(fonts/roboto-latin-400-normal.woff2); }
  @font-face { font-family: Roboto; font-weight: 500; src: url(fonts/roboto-latin-500-normal.woff2); }
  @font-face { font-family: Roboto; font-weight: 700; src: url(fonts/roboto-latin-700-normal.woff2); }
  body { margin: 0; background: #ddd; font-family: Roboto, sans-serif; color: #000; }
  .stage { display: flex; gap: 28px; padding: 24px; width: max-content; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .cap { font-size: 22px; font-weight: 700; }
  .cap small { display: block; font-size: 15px; font-weight: 400; color: #333; margin-top: 4px; max-width: 520px; line-height: 1.35; }
  .screen { width: 520px; height: 1000px; background: #fff; overflow: hidden; position: relative; border: 1px solid #999; }
  .sb { height: 24px; display: flex; justify-content: space-between; align-items: center; padding: 0 12px; font-size: 13px; font-weight: 500; }
  .title { font-size: 28px; font-weight: 700; padding: 20px 16px 10px; display: flex; align-items: center; gap: 12px; }
  .back { width: 40px; height: 40px; border: 2px solid #000; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .back svg { width: 26px; height: 26px; }
  .rule3 { height: 3px; background: #000; }
  .para { font-size: 14px; color: #333; padding: 8px 20px 4px; line-height: 1.4; }
  .status { font-size: 17px; font-weight: 700; padding: 14px 16px 10px; }
  .btns { display: flex; gap: 8px; padding: 10px 12px; }
  .btn { flex: 1; min-height: 44px; border: 2px solid #000; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; text-align: center; padding: 0 8px; }
  .sec { padding: 20px 20px 8px; font-size: 14px; font-weight: 700; letter-spacing: .06em; }
  .card { margin: 0 12px; border: 2px solid #000; border-radius: 8px; overflow: hidden; }
  .card > * + * { border-top: 1px solid #000; }
  .menu { display: flex; align-items: center; gap: 14px; padding: 12px 14px; }
  .menu .ic { width: 40px; height: 40px; border: 2px solid #000; border-radius: 20px; display: flex; align-items: center; justify-content: center; flex: none; }
  .menu .ic svg { width: 22px; height: 22px; }
  .menu .t { flex: 1; min-width: 0; }
  .menu .t1 { font-size: 18px; font-weight: 500; }
  .menu .t2 { font-size: 13px; color: #333; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu .chev { font-size: 26px; font-weight: 700; }
  .choice { display: flex; align-items: center; padding: 12px 16px; font-size: 17px; font-weight: 500; }
  .choice b { margin-left: auto; font-size: 15px; }
  .check { display: flex; align-items: flex-start; gap: 14px; padding: 12px 16px; font-size: 17px; }
  .check .d { font-size: 13px; color: #333; margin-top: 3px; line-height: 1.35; }
  .box { width: 18px; height: 18px; border: 2px solid #000; border-radius: 2px; position: relative; flex: none; margin-top: 2px; }
  .box.on { background: #000; }
  .box.on::after { content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .slider { padding: 10px 16px; font-size: 15px; }
  .track { position: relative; height: 26px; margin: 0 6px; }
  .track i { position: absolute; left: 0; right: 0; top: 12px; height: 2px; background: #888; }
  .track u { position: absolute; left: 0; top: 12px; height: 2px; background: #000; }
  .track s { position: absolute; top: 6px; width: 14px; height: 14px; border-radius: 50%; background: #000; margin-left: -7px; }
  .item { display: flex; align-items: center; padding: 8px 10px 8px 14px; gap: 6px; }
  .item .ic { width: 38px; height: 38px; border: 2px solid #000; border-radius: 19px; display: flex; align-items: center; justify-content: center; flex: none; margin-right: 6px; }
  .item .ic svg { width: 20px; height: 20px; }
  .item .t { flex: 1; min-width: 0; }
  .item .t1 { font-size: 17px; font-weight: 500; }
  .item .t2 { font-size: 13px; color: #333; }
  .ib { width: 40px; height: 40px; border: 2px solid #000; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex: none; }
  .ib.off { border-color: #888; } .ib.off svg { fill: #888; }
  .ib svg { width: 22px; height: 22px; }
  .new { outline: 3px dashed #000; outline-offset: -3px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; border: 1.5px solid #000; border-radius: 4px; padding: 1px 5px; margin-left: 8px; vertical-align: 2px; }
</style></head>
<body><div class="stage" id="stage"></div>
<script>
const P = {
  back: "M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z",
  gesture: "M9 11.24V7.5a2.5 2.5 0 015 0v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63l-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.43-.72c-.08-.01-.15-.03-.24-.03-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.44 1.06.44h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27c.01-.07.02-.14.02-.2 0-.62-.38-1.16-.91-1.38z",
  panel: "M3 4h18v16H3V4zm2 2v12h9V6H5zm11 0v12h3V6h-3z",
  star: "M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z",
  toggle: "M17 7H7a5 5 0 000 10h10a5 5 0 000-10zm0 8a3 3 0 110-6 3 3 0 010 6z",
  apps: "M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z",
  history: "M13 3a9 9 0 00-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0013 21a9 9 0 000-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z",
  bug: "M20 8h-2.81a5.985 5.985 0 00-1.82-1.96L17 4.41 15.59 3l-2.17 2.17a6.002 6.002 0 00-2.83 0L8.41 3 7 4.41l1.62 1.63C7.88 6.55 7.26 7.22 6.81 8H4v2h2.09c-.05.33-.09.66-.09 1v1H4v2h2v1c0 .34.04.67.09 1H4v2h2.81c1.04 1.79 2.97 3 5.19 3s4.15-1.21 5.19-3H20v-2h-2.09c.05-.33.09-.66.09-1v-1h2v-2h-2v-1c0-.34-.04-.67-.09-1H20V8zm-6 8h-4v-2h4v2zm0-4h-4v-2h4v2z",
  tune: "M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z",
  wifi: "M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.237 4.237 0 00-6 0zm-4-4l2 2a7.074 7.074 0 0110 0l2-2C15.14 9.14 8.87 9.14 5 13z",
  bt: "M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z",
  plane: "M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z",
  dnd: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11H7v-2h10v2z",
  refresh: "M17.65 6.35A7.958 7.958 0 0012 4a8 8 0 108 8h-2a6 6 0 11-1.76-4.24L13 11h7V4l-2.35 2.35z",
  up: "M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z", down: "M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z",
  del: "M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z",
};
const svg = (k) => `<svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="${P[k]}"/></svg>`;
const sb = `<div class="sb"><span>5:40</span><span>100%</span></div>`;
const home = `${sb}<div class="title">SuperBoox</div><div class="rule3"></div>`;
const sub = (t) => `${sb}<div class="title"><div class="back">${svg("back")}</div>${t}</div><div class="rule3"></div>`;
const card = (rows, cls = "") => `<div class="card ${cls}">${rows.join("")}</div>`;
const sec = (t) => `<div class="sec">${t}</div>`;
const btns = (...l) => `<div class="btns">${l.map(b => `<div class="btn">${b}</div>`).join("")}</div>`;
const menu = (ic, t1, t2) => `<div class="menu"><div class="ic">${svg(ic)}</div><div class="t"><div class="t1">${t1}</div><div class="t2">${t2}</div></div><div class="chev">›</div></div>`;
const choice = (k, v) => `<div class="choice">${k}<b>${v}&nbsp; ›</b></div>`;
const check = (l, on, d = "", tag = "") => `<div class="check"><div class="box ${on ? "on" : ""}"></div><div>${l}${tag ? `<span class="tag">${tag}</span>` : ""}${d ? `<div class="d">${d}</div>` : ""}</div></div>`;
const slider = (l, v, a, b, u) => `<div class="slider">${l}: ${v} ${u}<div class="track"><i></i><u style="width:${(v-a)/(b-a)*100}%"></u><s style="left:${(v-a)/(b-a)*100}%"></s></div></div>`;
const ib = (k, off) => `<div class="ib ${off ? "off" : ""}">${svg(k)}</div>`;
const ctl = (ic, t1, t2, i, n) => `<div class="item"><div class="ic">${svg(ic)}</div><div class="t"><div class="t1">${t1}</div><div class="t2">${t2}</div></div>${ib("up", i === 0)}${ib("down", i === n - 1)}${ib("del")}</div>`;

const homeScreen = home
  + `<div class="para" style="padding-top:12px">A Supernote-style Quick Access panel for BOOX. Swipe from the screen edge on any page to open it.</div>`
  + `<div style="height:8px"></div>` + card([`<div class="status">● Service is running</div>`, btns("Accessibility settings", "Open panel")])
  + sec("OPENING THE PANEL") + card([
      menu("gesture", "Gesture", "Right edge · Swipe up or down along the edge"),
      menu("panel", "Look &amp; size", "45% wide · Large menu · Starts on page 1"),
    ])
  + sec("IN THE PANEL") + card([
      menu("star", "Quick Access items", "4 items"),
      menu("toggle", "Quick Controls", "On · 10 controls"),
      menu("apps", "Apps at the bottom", "5 apps · Previous app included"),
      menu("history", "Recent files", "Off"),
    ])
  + sec("HELP") + card([
      menu("bug", "Troubleshooting", "Copy or share a debug report"),
      menu("tune", "Advanced", "BOOX Notes package"),
    ]);

const lookScreen = sub("Look &amp; size")
  + sec("SIZE") + card([
      slider("Panel width", 45, 25, 100, "% of screen"),
      choice("Menu size", "Large"),
    ])
  + sec("ICONS") + card([
      check("Use apps' own icons for pinned apps", false, "Off: every app gets the same black app icon, to match the rest of the panel."),
    ])
  + sec("PAGES") + card([
      check("Remember last page", false, "Quick Controls and apps reopen on the page you left them on. Off: they start on page 1 each time the panel opens.", "NEW"),
    ], "new");

const C = [["wifi", "Wi‑Fi"], ["bt", "Bluetooth"], ["plane", "Airplane mode"], ["dnd", "Do Not Disturb"], ["refresh", "Full Refresh"]];
const qcScreen = sub("Quick Controls")
  + `<div style="height:12px"></div>` + card([check("Show Quick Controls in the panel", true)])
  + sec("CONTROLS · 5 PER PAGE") + card([
      ...C.map(([ic, t], i) => ctl(ic, t, ic === "refresh" ? "Tap: full refresh" : "Tap: on/off · hold: its settings", i, 10)),
      `<div class="para" style="padding:10px 16px">+ 5 more on page 2</div>`,
      btns("+ Add control", "Reset to default"),
    ])
  + `<div class="para">Tap a control to switch it; hold it to open its settings. Swipe sideways or use ‹ › for more.</div>`;

document.getElementById("stage").innerHTML = `
  <div class="col"><div class="cap">Home<small>Status on top, then one row per section. Each row says what's set, so most people never need to open it.</small></div><div class="screen">${homeScreen}</div></div>
  <div class="col"><div class="cap">Look &amp; size<small>Panel width, menu size and icons move out of Gesture. "Remember last page" (new, off) lives here.</small></div><div class="screen">${lookScreen}</div></div>
  <div class="col"><div class="cap">Quick Controls<small>Each section page keeps today's bordered cards; ‹ goes back to Home (so does the Back button).</small></div><div class="screen">${qcScreen}</div></div>`;
</script></body></html>
